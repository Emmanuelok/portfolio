name: Creative agent deterministic governance

on:
  push:
    branches:
      - "agent/**"
    paths:
      - "src/lib/intelligence/**"
      - "src/app/api/intelligence/runs/route.ts"
      - "tests/intelligence-runtime.test.ts"
      - "evals/creative-agent/**"
      - "scripts/verify-creative-agent.mjs"
      - ".github/workflows/creative-agent-daily.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "src/lib/workspace/agent.ts"
      - "src/lib/workspace/types.ts"
      - "src/app/api/workspace/agent/route.ts"
      - "src/lib/workspace/local-analysis.ts"
      - "src/lib/intelligence/**"
      - "src/app/api/intelligence/runs/route.ts"
      - "tests/intelligence-runtime.test.ts"
      - "evals/creative-agent/**"
      - "scripts/verify-creative-agent.mjs"
      - ".github/workflows/creative-agent-daily.yml"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      verify_gateway_catalog:
        description: Verify the configured model against the public Gateway catalog
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: creative-agent-governance
  cancel-in-progress: false

jobs:
  evaluate:
    name: Verify deterministic configuration and safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `runner` context is not available in job-level env, so the report
    # directory is exported from a step below instead.
    env:
      VERIFY_GATEWAY_MODEL_CATALOG: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.verify_gateway_catalog) }}

    steps:
      - name: Check out the evaluated commit without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Choose the report directory
        run: echo "CREATIVE_AGENT_REPORT_DIR=$RUNNER_TEMP/creative-agent-evaluation" >> "$GITHUB_ENV"

      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts

      - name: Run deterministic governance verification
        run: npm run verify:creative-agent

      - name: Run governed intelligence runtime tests
        run: npm run test:intelligence

      - name: Publish the report in the workflow summary
        if: always()
        run: |
          if [ -f "$CREATIVE_AGENT_REPORT_DIR/summary.md" ]; then
            cat "$CREATIVE_AGENT_REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The verifier stopped before it could create a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-agent-governance-${{ github.run_id }}
          path: ${{ runner.temp }}/creative-agent-evaluation
          if-no-files-found: error
          retention-days: 30
