project:
  id: living-loom-portfolio
  name: "Living Loom — Emmanuel Kingsford Owusu Portfolio"
  owner: "Emmanuel Kingsford Owusu"
  status: implementation
  deadline: "Not specified; production deployment requested"

objective:
  primary_goal: "Present Emmanuel's graphic design, product design, websites, web applications, and research-led digital systems through a distinctive, usable public portfolio."
  audience_change:
    know: "Emmanuel turns complex ideas into coherent, useful, visually memorable digital products."
    feel: "Curious, confident in the craft, and eager to explore beyond the first project."
    remember: "The living blue thread that weaves research, strategy, design, and code into one body of work."
    do: "Explore case studies, visit live work where available, and start a relevant collaboration."
  success_metrics:
    - "A visitor can identify Emmanuel's practice and reach the featured work index from the first screen."
    - "Every featured project has a working detail route, truthful status, and clear next action."
    - "Primary navigation, theme selection, and project discovery work with keyboard, pointer, and touch."
    - "The experience reflows from 320px to wide desktop without horizontal page overflow."
    - "Non-essential motion respects prefers-reduced-motion."
    - "A verified Vercel production URL and public GitHub source URL are recorded at delivery."
  failure_conditions:
    - "The site reads as a generic neon, glass, or template portfolio."
    - "Visual spectacle obscures project names, descriptions, navigation, or controls."
    - "A project, award, service, client result, or deployment is represented without evidence."
    - "Generated imagery is presented internally as photographed documentary evidence."
    - "Core content or navigation depends on hover, fine pointer accuracy, or uninterrupted motion."

audience:
  primary: "Founders, product and design leaders, institutional partners, and prospective clients evaluating Emmanuel's design and digital-product capabilities."
  secondary: "Collaborators, academic and research partners, recruiters, and curious makers."
  context_of_use: "Public web portfolio on mobile and desktop; often first encountered through a shared project or profile link."
  prior_knowledge: "May know one project but not the range connecting design, research, education, and software."
  tension_or_need: "Visitors need fast proof of range without losing the depth, authorship, and context behind each project."
  objections:
    - "A broad practice may feel unfocused."
    - "Highly expressive interfaces can become difficult to navigate."
    - "Conceptual imagery can be mistaken for literal product screenshots."
  regions:
    - "Global"
    - "Canada"
    - "Ghana"
  languages:
    - en
  age_suitability: general
  accessibility_needs:
    - "Semantic landmarks and heading order"
    - "Keyboard-operable navigation, palette, filters, and theme controls"
    - "Visible focus treatment"
    - "Text and control contrast appropriate to their size"
    - "Reduced-motion parity"
    - "Purposeful alternative text for meaningful imagery"
    - "Minimum 44px touch targets for primary controls"

message:
  governing_idea: "Living Loom: every project is a thread; the portfolio reveals how Emmanuel weaves evidence, imagination, and engineering into useful systems."
  single_minded_proposition: "Emmanuel designs ambitious digital experiences with both visual conviction and systems depth."
  proof_points:
    - "Eight named portfolio case studies spanning education, research integrity, finance, visual modelling, fashion, productivity, and megaproject intelligence."
    - "Public source repository at https://github.com/Emmanuelok/portfolio."
    - "Functional case-study routes, project discovery, theme controls, and an accessible command palette in the implemented frontend."
  required_copy:
    - "Emmanuel Kingsford Owusu"
    - "Living Loom"
    - "Selected work"
    - "About"
    - "Lab"
    - "Contact"
  prohibited_implications:
    - "Do not imply that generated editorial covers are literal screenshots or documentary photographs."
    - "Do not imply that every represented project is currently live unless its destination has been verified."
    - "Do not imply legal clearance, trademark clearance, formal accessibility conformance, or third-party endorsement."
    - "Do not invent client outcomes, user counts, awards, testimonials, or performance statistics."
  call_to_action: "Explore the work"

brand:
  name: "Emmanuel Kingsford Owusu / Living Loom"
  attributes:
    - "tactile"
    - "editorial"
    - "intelligent"
    - "generous"
    - "precise"
    - "quietly audacious"
  non_negotiables:
    - "Graphite, warm-bone, and electric-ultramarine are functional roles, not decoration."
    - "The woven strand expresses relationships between ideas, screens, and outcomes."
    - "Editorial hierarchy remains legible beneath all motion and texture."
    - "Project imagery remains text-free; names and context use editable HTML."
    - "Every interactive treatment has a reduced-motion and keyboard-accessible equivalent."
  visual_assets:
    - "src/app/icon.svg"
    - "public/work/aceplore.webp"
    - "public/work/ccai-global.webp"
    - "public/work/elkings-college.webp"
    - "public/work/ghana-sec.webp"
    - "public/work/king-uml.webp"
    - "public/work/kisuyo.webp"
    - "public/work/megaproject-intelligence.webp"
    - "public/work/value-m.webp"
  verbal_rules:
    - "Lead with what the work changes, then explain how it was made."
    - "Use concrete nouns and active verbs."
    - "Keep labels short enough to scan while allowing case studies to carry nuance."
    - "State limitations and project status plainly."
  exclusions:
    - "generic AI-tech clichés"
    - "cyberpunk HUDs and decorative data streams"
    - "gratuitous glassmorphism, glow, and identical rounded cards"
    - "scroll-jacking or an unskippable intro"
    - "close imitation of a named living creator, studio, or protected franchise"

world:
  characters:
    - "Fictional adult Black creative in the Aceplore editorial concept."
    - "Fictional adult Black fashion designer/model in the Kisuyo editorial concept."
    - "Age-appropriate adult or older-teen learners in the Elkings College editorial concept; not based on identified people."
  products:
    - "Eight portfolio projects represented by conceptual editorial cover imagery and factual HTML case-study content."
  props:
    - "Ultramarine woven strand"
    - "Ivory paper planes"
    - "Graphite architectural forms"
    - "Brass measurement gates"
    - "Diagram nodes and physical models"
  environments:
    - "Tactile studio"
    - "Museum-like diagram installation"
    - "Abstract evidence architecture"
    - "Contemporary Ghanaian-inspired learning environment"
  time_period: "Contemporary"
  geography: "Global practice with Ghanaian and Canadian context; generated covers are conceptual, not documentary locations."
  season_weather_time: "Controlled editorial studio light; no implied real date or weather."
  continuity_anchors:
    - "Warm bone, graphite, and electric ultramarine"
    - "One continuous blue strand or route"
    - "Tactile paper, thread, stone, brass, and fabric"
    - "3:2 editorial compositions with deliberate negative space"
    - "No embedded words, logos, or watermarks"

creative_direction:
  concept_title: "Living Loom"
  premise: "A responsive strand moves through the portfolio, connecting project disciplines without flattening their differences."
  narrative_or_information_arc: "Identity and proposition → selected work → individual case-study context and process → broader practice and experiments → clear contact path."
  emotional_arc:
    - "Immediate intrigue"
    - "Confident orientation"
    - "Increasing depth"
    - "Credible proof"
    - "Open invitation"
  visual_thesis: "A warm editorial field is cut and connected by one electric-blue woven gesture; tactile physical models make systems thinking visible."
  palette:
    - "Graphite #141617"
    - "Warm bone #F3EDDF"
    - "Paper #FFFDF7"
    - "Electric ultramarine #3157FF"
    - "Brass #B47A2A"
    - "Clay #A33D2E"
  materials_textures:
    - "uncoated paper"
    - "woven thread"
    - "matte graphite"
    - "brushed brass"
    - "tailored fabric"
    - "subtle print grain"
  composition: "Editorial asymmetry, strong type/image counterpoint, long reading lines, alternating density, and intentional off-grid moments anchored by a stable content rail."
  camera_and_lens: "Generated covers use grounded editorial perspective and legible physical scale; the interface uses no simulated camera movement."
  lighting: "Soft directional studio light with controlled hard-edged paper shadows; no unexplained bloom."
  motion: "A restrained thread-draw language for reveals and state changes; short direct feedback; no blocking sequence or continuous distraction."
  sound: "None in the public web experience."
  typography: "Newsreader for expressive editorial display; Manrope for interface, labels, and body copy; system fallbacks remain legible."
  interaction: "Direct project exploration, theme control, command palette, meaningful hover/focus states, and native scrolling."
  anti_goals:
    - "A grid of interchangeable portfolio cards"
    - "Empty maximalist spectacle"
    - "An AI-control-panel aesthetic"
    - "Hidden navigation"
    - "Fake metrics or dead controls"

deliverables:
  master:
    - "Responsive Next.js portfolio source"
    - "Production Vercel deployment"
    - "Eight project case-study experiences"
    - "Living Loom brand and interaction system"
  variants:
    - "Light, ink, and system-resolved themes"
    - "Mobile, intermediate, and wide responsive compositions"
    - "Reduced-motion behavior"
    - "Static social metadata artwork generated by the application"
  channels:
    - "Public web"
    - "GitHub source repository"
    - "Vercel production"
  aspect_ratios:
    - "Responsive viewport"
    - "3:2 project imagery"
    - "1.91:1 social preview"
  dimensions:
    - "Minimum supported viewport: 320 CSS px"
    - "Project imagery source: 1536x1024 px"
  durations_seconds: []
  frame_rates: []
  file_formats:
    - "TSX"
    - "CSS"
    - "SVG"
    - "WebP"
    - "JSON"
    - "CSV"
    - "YAML"
  captions: false
  transcript: false
  alt_text: true
  poster_or_thumbnail: true
  editable_sources: true

inputs:
  media:
    - "Eight original generated 1536x1024 PNG concepts converted to stripped WebP quality 82 for the site."
  audio: []
  documents:
    - "Direct Creative Production templates adapted in creative/."
  urls:
    - "https://github.com/Emmanuelok/portfolio"
  codebase: "Next.js 16 App Router, React 19, TypeScript, Motion, Lucide, Manrope, and Newsreader."
  reference_purpose_notes:
    - "User requested a futuristic, out-of-the-ordinary showcase; the chosen direction translates that ambition into tactile editorial interaction instead of trend mimicry."

production:
  required_tools:
    - "GitHub"
    - "Next.js"
    - "OpenAI built-in image generation; model not exposed"
    - "Vercel"
  fidelity: production
  budget_or_credit_limit: "Not specified"
  approval_gates:
    - "G0 brief"
    - "G1 Living Loom direction"
    - "G2 representative project imagery"
    - "G3 brand, component, rights, and accessibility system"
    - "G4 functional local frontend"
    - "G5 visual and technical finish"
    - "G6 verified production delivery"
  localization:
    - "English only in this release"
  deadline_constraints:
    - "No deadline supplied; complete and verify within the active build request."

rights_and_compliance:
  likeness_permissions:
    - "Generated people are fictional and not based on supplied identifiable references; no real-person endorsement is claimed."
  licenses:
    - "Repository dependencies retain their own licenses."
    - "Manrope and Newsreader font-license metadata must remain available through their packages; legal review has not been performed."
  trademarks:
    - "Project names are displayed for portfolio identification; trademark clearance has not been performed."
  factual_claims:
    - "Project descriptions and live-link status require owner verification before release when not evidenced by the repository."
  required_disclosures:
    - "Internal provenance retained for every generated cover."
    - "Public synthetic-media labels are not planned because the covers are clearly conceptual editorial art, not claimed documentary evidence; re-evaluate if used in a misleading context."
  privacy_constraints:
    - "Do not publish private contact details, credentials, analytics identifiers, or non-public client information."
  unresolved_items:
    - "Legal, trademark, and font-license review not performed."
    - "Formal WCAG conformance audit not performed."
    - "Production URL and all outbound project links must be verified after deployment."

assumptions:
  - "Emmanuel controls the requested GitHub repository and authorizes this portfolio implementation."
  - "The public GitHub repository is the safe source-code destination requested by the user."
  - "The contact experience uses public navigation and mail-safe patterns without exposing private information."
  - "Generated covers function as conceptual portfolio art and do not assert real products, people, buildings, or outcomes."

open_questions:
  - "Which single public email or form destination should be used if a direct contact address is later added?"
  - "Which represented project URLs are owner-approved and currently production-ready?"
  - "Should future releases add a downloadable résumé after the final document and privacy review?"
