project:
  id: kingxford-studio
  name: "Kingxford"
  owner: "Kingxford"
  status: implementation
  deadline: "Not specified; production deployment requested"

objective:
  primary_goal: "Present Kingxford's graphic design, product design, websites, web applications, and research-led digital systems through a distinctive, usable public portfolio."
  audience_change:
    know: "Kingxford turns complex ideas into coherent, useful, visually memorable digital products."
    feel: "Curious, confident in the craft, and eager to explore beyond the first project."
    remember: "The dominant architectural X connecting Studio, the Living Room, and Lab."
    do: "Explore case studies, visit live work where available, and start a relevant collaboration."
  success_metrics:
    - "A visitor can identify Kingxford's practice and reach the featured work index from the first screen."
    - "Every featured project has a working detail route, truthful status, and clear next action."
    - "Primary navigation, theme selection, and project discovery work with keyboard, pointer, and touch."
    - "The experience reflows from 320px to wide desktop without horizontal page overflow."
    - "Non-essential motion respects prefers-reduced-motion."
    - "A verified Vercel production URL and public GitHub source URL are recorded at delivery."
  failure_conditions:
    - "The site reads as a generic neon, glass, or template portfolio."
    - "Visual spectacle obscures project names, descriptions, navigation, or controls."
    - "A project, award, service, client result, or deployment is represented without evidence."
    - "Context photography is presented as literal evidence from a represented client or research project."
    - "Photoreal conceptual editorial imagery is left undisclosed or presented as documentary evidence, a measured outcome, literal product UI, a real facility, or a real person."
    - "Generated imagery contains fabricated readable text, interface states, metrics, testimonials, citations, or product claims."
    - "Core content or navigation depends on hover, fine pointer accuracy, or uninterrupted motion."

audience:
  primary: "Founders, product and design leaders, institutional partners, and prospective clients evaluating Kingxford's design and digital-product capabilities."
  secondary: "Collaborators, academic and research partners, recruiters, and curious makers."
  context_of_use: "Public web portfolio on mobile and desktop; often first encountered through a shared project or profile link."
  prior_knowledge: "May know one project but not the range connecting design, research, education, and software."
  tension_or_need: "Visitors need fast proof of range without losing the depth, authorship, and context behind each project."
  objections:
    - "A broad practice may feel unfocused."
    - "Highly expressive interfaces can become difficult to navigate."
    - "Conceptual imagery can be mistaken for literal product screenshots."
  regions:
    - "Global"
    - "Canada"
  languages:
    - en
  age_suitability: general
  accessibility_needs:
    - "Semantic landmarks and heading order"
    - "Keyboard-operable navigation, palette, filters, and theme controls"
    - "Visible focus treatment"
    - "Text and control contrast appropriate to their size"
    - "Reduced-motion parity"
    - "Purposeful alternative text for meaningful imagery"
    - "Minimum 44px touch targets for primary controls"

message:
  governing_idea: "X-Frame: Studio, the Living Room, and Lab cross inside one company and one standard of craft."
  single_minded_proposition: "Kingxford designs ambitious digital experiences with both visual conviction and systems depth."
  proof_points:
    - "Eight named portfolio case studies spanning connected consultancy, reflective learning, strategy games, education, research integrity, finance, productivity, and value management."
    - "A Kingxford Media index and complete first field note, How to Get Ahead in the AI Era, with institutional research notes and an optional audio architecture."
    - "Public source repository at https://github.com/Emmanuelok/portfolio."
    - "Functional case-study and Media routes, project discovery, theme controls, and an accessible command palette in the implemented frontend."
  required_copy:
    - "Kingxford"
    - "Studio"
    - "The Living Room"
    - "Lab"
    - "Selected work"
    - "Media"
    - "About"
    - "Kingxford Lab"
    - "Contact"
  prohibited_implications:
    - "Do not imply that contextual licensed photographs document the represented product, commission, or study."
    - "Do not imply that synthetic conceptual editorial imagery documents a real product interface, person, facility, commission, study, or measured outcome."
    - "Do not imply that every represented project is currently live unless its destination has been verified."
    - "Do not imply legal clearance, trademark clearance, formal accessibility conformance, or third-party endorsement."
    - "Do not invent client outcomes, user counts, awards, testimonials, or performance statistics."
  call_to_action: "Explore the work"

brand:
  name: "Kingxford"
  attributes:
    - "tactile"
    - "editorial"
    - "intelligent"
    - "generous"
    - "precise"
    - "quietly audacious"
  non_negotiables:
    - "Graphite, warm-bone, and electric-ultramarine are functional roles, not decoration."
    - "The X is dominant in the identity and acts as a structural crossing, not decorative lettering."
    - "Editorial hierarchy remains legible beneath all motion and texture."
    - "Photoreal conceptual editorial imagery is allowed only when clearly disclosed and never presented as documentary evidence, a measured outcome, or literal product UI."
    - "Contextual licensed photographs never pretend to be project evidence."
    - "Every interactive treatment has a reduced-motion and keyboard-accessible equivalent."
  visual_assets:
    - "src/app/icon.svg"
    - "public/work/aceplore-real.webp"
    - "public/work/ccai-global-concept.webp"
    - "public/work/elkings-college-real.webp"
    - "public/work/grandmaster-concept.webp"
    - "public/work/nkosuo-concept.webp"
    - "public/work/psyche-atlas-concept.webp"
    - "public/work/value-m-real.webp"
    - "public/work/veridanth-concept.webp"
    - "public/motion/kingxford-strategy-room.webp"
    - "public/motion/kingxford-strategy-room-portrait.webp"
    - "public/motion/kingxford-scientific-lab.webp"
    - "public/motion/kingxford-scientific-lab-portrait.webp"
    - "public/media/how-to-get-ahead-in-the-ai-era-concept.webp"
  verbal_rules:
    - "Lead with what the work changes, then explain how it was made."
    - "Use concrete nouns and active verbs."
    - "Keep labels short enough to scan while allowing case studies to carry nuance."
    - "State limitations and project status plainly."
  exclusions:
    - "generic AI-tech clichés"
    - "cyberpunk HUDs and decorative data streams"
    - "gratuitous glassmorphism, glow, and identical rounded cards"
    - "scroll-jacking or an unskippable intro"
    - "close imitation of a named living creator, studio, or protected franchise"

world:
  characters:
    - "Licensed documentary subjects shown only as contextual editorial imagery."
    - "Fictional adults in generated conceptual imagery shown only as illustrative participants; no real identity, employment, client relationship, study participation, or endorsement is implied."
  products:
    - "Eight portfolio projects represented by five disclosed conceptual editorial covers, three licensed contextual photographs, factual HTML case-study content, and verified outbound links where available."
    - "Kingxford Media represented by an index, a complete first field note, cited research notes, and an optional audio surface with no narration shipped."
  props:
    - "Architectural X-Frame"
    - "Physical briefs, evidence planes, project models, assessment materials, research dossiers, and strategy boards"
    - "Plausible production and scientific equipment"
  environments:
    - "Real film and design studios"
    - "Disclosed conceptual interdisciplinary strategy room for the Living Room"
    - "Disclosed conceptual molecular and analytical laboratory for the Lab"
    - "Real campus architecture"
  time_period: "Contemporary"
  geography: "Global company with Canadian context; every documentary source and synthetic generation record is documented in rights-provenance.csv."
  season_weather_time: "Licensed photography retains documented light; conceptual imagery uses physically plausible contemporary editorial lighting."
  continuity_anchors:
    - "Warm bone, graphite, and electric ultramarine"
    - "One dominant X connecting the three worlds"
    - "Licensed documentary context and clearly disclosed Operational Realism concept imagery"
    - "3:2 editorial compositions with deliberate negative space"
    - "No watermarks, fabricated readable text, literal generated interfaces, or misleading documentary details"

creative_direction:
  concept_title: "X-Frame"
  premise: "An architectural X crosses licensed documentary environments and clearly disclosed conceptual editorial imagery, connecting three distinct Kingxford worlds without flattening their differences."
  narrative_or_information_arc: "Identity and proposition → selected work → individual case-study context and process → Media ideas and practical guidance → broader practice and experiments → clear contact path."
  emotional_arc:
    - "Immediate intrigue"
    - "Confident orientation"
    - "Increasing depth"
    - "Credible proof"
    - "Open invitation"
  visual_thesis: "A warm editorial field is cut by an electric-blue structural X; licensed context and disclosed photoreal conceptual imagery make the company tangible without pretending to be documentary proof."
  palette:
    - "Graphite #141617"
    - "Warm bone #F3EDDF"
    - "Paper #FFFDF7"
    - "Electric ultramarine #3157FF"
    - "Brass #B47A2A"
    - "Clay #A33D2E"
  materials_textures:
    - "uncoated paper"
    - "matte graphite"
    - "brushed brass"
    - "photographic grain"
    - "subtle print grain"
  composition: "Editorial asymmetry, strong type/image counterpoint, long reading lines, alternating density, and intentional off-grid moments anchored by a stable content rail."
  camera_and_lens: "Licensed sources retain grounded documentary perspective; generated concepts use plausible eye-level, tabletop, or editorial-wide viewpoints with crop-safe focal action."
  lighting: "Preserve licensed environmental light; generated concepts use physically plausible editorial light, natural skin and material response, and no unexplained glow."
  motion: "A long native-scroll sequence crossfades and pans licensed and disclosed conceptual WebP layers while the X assembles and settles; no short looping film or scroll-jacking."
  sound: "No audio is shipped in this release. Media supports optional future narration only after consent, editorial, and listening review under creative/narration-policy.md."
  typography: "Newsreader for expressive editorial display; Manrope for interface, labels, and body copy; system fallbacks remain legible."
  interaction: "Direct project exploration, theme control, command palette, meaningful hover/focus states, and native scrolling."
  anti_goals:
    - "A grid of interchangeable portfolio cards"
    - "Empty maximalist spectacle"
    - "An AI-control-panel aesthetic"
    - "Hidden navigation"
    - "Fake metrics or dead controls"

deliverables:
  master:
    - "Responsive Next.js portfolio source"
    - "Production Vercel deployment"
    - "Eight project case-study experiences"
    - "Kingxford Media index and first long-form field note"
    - "Kingxford X-Frame brand and interaction system"
  variants:
    - "Light, ink, and system-resolved themes"
    - "Mobile, intermediate, and wide responsive compositions"
    - "Reduced-motion behavior"
    - "Static social metadata artwork generated by the application"
  channels:
    - "Public web"
    - "GitHub source repository"
    - "Vercel production"
  aspect_ratios:
    - "Responsive viewport"
    - "3:2 project imagery"
    - "1.91:1 social preview"
  dimensions:
    - "Minimum supported viewport: 320 CSS px"
    - "Active project imagery delivery: 1536x1024 to 2400x1600 px"
  durations_seconds: []
  frame_rates: []
  file_formats:
    - "TSX"
    - "CSS"
    - "SVG"
    - "WebP"
    - "JSON"
    - "CSV"
    - "YAML"
  captions: false
  transcript: false
  alt_text: true
  poster_or_thumbnail: true
  editable_sources: true

inputs:
  media:
    - "Five photoreal conceptual project covers generated with Imagegen on 2026-07-30."
    - "Four photoreal strategy-room and scientific-lab plates generated with Imagegen on 2026-07-30."
    - "One photoreal conceptual Media cover generated with Imagegen on 2026-07-30."
    - "Three licensed documentary project photographs."
    - "Three licensed documentary arrival and Studio plates for the cinematic and world cards."
  audio:
    - "No narration asset shipped; optional future audio must follow creative/narration-policy.md."
  documents:
    - "Direct Creative Production templates adapted in creative/."
  urls:
    - "https://github.com/Emmanuelok/portfolio"
  codebase: "Next.js 16 App Router, React 19, TypeScript, Motion, Lucide, Manrope, and Newsreader."
  reference_purpose_notes:
    - "User requested a futuristic, out-of-the-ordinary showcase; the chosen direction translates that ambition into tactile editorial interaction instead of trend mimicry."

production:
  required_tools:
    - "GitHub"
    - "Imagegen"
    - "Next.js"
    - "Vercel"
  fidelity: production
  budget_or_credit_limit: "Not specified"
  approval_gates:
    - "G0 brief"
    - "G1 Kingxford X-Frame direction"
    - "G2 representative project imagery"
    - "G3 brand, component, rights, and accessibility system"
    - "G4 functional local frontend"
    - "G5 visual and technical finish"
    - "G6 verified production delivery"
  localization:
    - "English only in this release"
  deadline_constraints:
    - "No deadline supplied; complete and verify within the active build request."

rights_and_compliance:
  likeness_permissions:
    - "Licensed documentary photographs may contain adult subjects; release status is not independently verified and no endorsement is claimed."
    - "Generated conceptual images contain fictional adults; no source likeness or real-person identity is intended, and no employment, client relationship, study participation, or endorsement is implied."
  licenses:
    - "Repository dependencies retain their own licenses."
    - "Manrope and Newsreader font-license metadata must remain available through their packages; legal review has not been performed."
  trademarks:
    - "Project names are displayed for portfolio identification; trademark clearance has not been performed."
  factual_claims:
    - "Project descriptions and live-link status require owner verification before release when not evidenced by the repository."
  required_disclosures:
    - "Source or generation tool, date, prompt direction, material edit, editorial context, restrictions, and final checksum are recorded for every active image."
    - "Context photographs are not represented as evidence from a client engagement, study, or product workflow."
    - "Synthetic conceptual imagery is clearly identified and is never represented as documentary evidence, a measured outcome, literal product UI, a real facility, or a real person."
  privacy_constraints:
    - "Do not publish private contact details, credentials, analytics identifiers, or non-public client information."
  unresolved_items:
    - "Legal, trademark, and font-license review not performed."
    - "Formal WCAG conformance audit not performed."
    - "Production URL and all outbound project links must be verified after deployment."
    - "Narration is optional and not shipped; any future edition requires a licensed or consented voice, human editorial review, a complete transcript, and listening QA."

assumptions:
  - "The authorized repository owner controls the requested GitHub repository and authorizes this Kingxford implementation."
  - "The public GitHub repository is the safe source-code destination requested by the user."
  - "The contact experience uses public navigation and mail-safe patterns without exposing private information."
  - "Licensed contextual photography does not assert affiliation, participation, endorsement, or a documented project outcome."
  - "Disclosed conceptual imagery does not assert a literal product interface, real facility, employee identity, participant, endorsement, or measured outcome."

open_questions:
  - "Which single public email or form destination should be used if a direct contact address is later added?"
  - "Which represented project URLs are owner-approved and currently production-ready?"
  - "Should future releases add a downloadable résumé after the final document and privacy review?"
