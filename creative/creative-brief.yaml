    - "GitHub"
    - "Imagegen"
    - "Next.js"
    - "Vercel"
  fidelity: production
  budget_or_credit_limit: "Not specified"
  approval_gates:
    - "G0 brief"
    - "G1 kingXford & Co X-Frame direction"
    - "G2 representative project imagery"
    - "G3 brand, component, rights, and accessibility system"
    - "G4 functional local frontend"
    - "G5 visual and technical finish"
    - "G6 verified production delivery"
  localization:
    - "English only in this release"
  deadline_constraints:
    - "No deadline supplied; complete and verify within the active build request."

rights_and_compliance:
  likeness_permissions:
    - "Licensed documentary photographs may contain adult subjects; release status is not independently verified and no endorsement is claimed."
    - "Generated conceptual images contain fictional adults; no source likeness or real-person identity is intended, and no employment, client relationship, study participation, or endorsement is implied."
  licenses:
    - "Repository dependencies retain their own licenses."
    - "Manrope and Newsreader font-license metadata must remain available through their packages; legal review has not been performed."
  trademarks:
    - "Project names are displayed for portfolio identification; trademark clearance has not been performed."
  factual_claims:
    - "Project descriptions and live-link status require owner verification before release when not evidenced by the repository."
  required_disclosures:
    - "Source or generation tool, date, prompt direction, material edit, editorial context, restrictions, and final checksum are recorded for every active image."
    - "Context photographs are not represented as evidence from a client engagement, study, or product workflow."
    - "Synthetic conceptual imagery is clearly identified and is never represented as documentary evidence, a measured outcome, literal product UI, a real facility, or a real person."
  privacy_constraints:
    - "Do not publish private contact details, credentials, analytics identifiers, or non-public client information."
  unresolved_items:
    - "Legal, trademark, and font-license review not performed."
    - "Formal WCAG conformance audit not performed."
    - "Production URL and all outbound project links must be verified after deployment."
    - "Narration is optional and not shipped; any future edition requires a licensed or consented voice, human editorial review, a complete transcript, and listening QA."

assumptions:
  - "The authorized repository owner controls the operational source repository and authorizes this kingXford & Co implementation."
  - "Operational source and deployment identifiers remain in non-rendered release records only where technically necessary."
  - "The contact experience uses company-safe channels without exposing personal profiles, location, or private information."
  - "Licensed contextual photography does not assert affiliation, participation, endorsement, or a documented project outcome."
  - "Disclosed conceptual imagery does not assert a literal product interface, real facility, employee identity, participant, endorsement, or measured outcome."

open_questions:
  - "Which single public email or form destination should be used if a direct contact address is later added?"
  - "Which represented project URLs are owner-approved and currently production-ready?"
  - "Should future releases add a company research library, evidence dashboard, or institutional partnership prospectus after content and privacy review?"
